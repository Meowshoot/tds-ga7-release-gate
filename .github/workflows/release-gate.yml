name: TDS GA7 Release Gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest

      - name: 'TDS identity: 22f1000561@ds.study.iitm.ac.in'
        run: echo "Identity verified for 22f1000561@ds.study.iitm.ac.in"

      - name: Run policy tests
        run: python -m pytest test_release_gate.py
