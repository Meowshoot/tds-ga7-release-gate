name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest

      - name: "TDS identity: 22f1000561@ds.study.iitm.ac.in"
        run: echo "Identity verified: 22f1000561@ds.study.iitm.ac.in"

      - name: Run policy tests
        run: |
          python -c "import test_release_gate; [getattr(test_release_gate, f)() for f in dir(test_release_gate) if f.startswith('test_')]; print('RELEASE GATE POLICY TESTS PASSED!')"
